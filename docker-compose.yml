services:
  trinetra-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trinetra-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=TRINETRA
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://trinetra_user:trinetra_secure_pass_2026@trinetra-db:5432/trinetra_db
      - JWT_SECRET_KEY=trinetra_super_secret_jwt_key_ddugu_2026_gdg
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      trinetra-db:
        condition: service_healthy
      trinetra-redis:
        condition: service_healthy
    networks:
      - trinetra-network

  trinetra-db:
    image: postgres:16-alpine
    container_name: trinetra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trinetra_user
      POSTGRES_PASSWORD: trinetra_secure_pass_2026
      POSTGRES_DB: trinetra_db
    ports:
      - "127.0.0.1:5432:5432" # Bound strictly to localhost for defense-in-depth isolation
    volumes:
      - trinetra-pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_btree_gist.sql:/docker-entrypoint-initdb.d/init_btree_gist.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra_user -d trinetra_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trinetra-network

  trinetra-redis:
    image: redis:7-alpine
    container_name: trinetra-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - trinetra-network

volumes:
  trinetra-pgdata:
    driver: local

networks:
  trinetra-network:
    driver: bridge
